name: {{project_name.snakeCase()}}
description: A new Flutter project called {{project_name.titleCase()}}.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  pine: ^1.0.4
  flutter_bloc: ^9.1.1
  provider: ^6.1.5
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  auto_route: ^11.1.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.2
  # auto_route_generator stays on major 10: the 10.5.x line is the one that
  # supports auto_route 11.x (the generator has no major 11).
  auto_route_generator: ^10.5.0


flutter:
  uses-material-design: true
  assets:
    - lib/other/media/images/

